<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metroid Scan - Viewer</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a;
        font: 13px/1.4 ui-monospace, Menlo, monospace; color: #d7e2e6; }
      #app { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
        touch-action: none; }
      #status { position: fixed; left: 12px; top: 12px; padding: 10px 12px;
        background: rgba(4,12,15,.78); border: 1px solid #1e7a5f; border-radius: 10px;
        white-space: pre-wrap; pointer-events: none; }
      #back { position: fixed; right: 12px; top: 12px; color: #7cf7c4;
        text-decoration: none; padding: 8px 12px; border: 1px solid #1e3a44;
        border-radius: 8px; background: rgba(4,12,15,.78); }
      #replay { position: fixed; left: 12px; bottom: 12px; display: flex;
        flex-direction: column; gap: 6px; padding: 8px 10px;
        max-height: 74vh; overflow-y: auto;
        background: rgba(4,12,15,.86); border: 1px solid #1e3a44;
        border-radius: 10px; }
      #replay .row { display: flex; gap: 8px; align-items: center; }
      #algoToggle { cursor: pointer; }
      #algoSummary { color: #7cf7c4; font-size: 12px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #algoBox { display: flex; flex-direction: column; gap: 6px; }
      /* Beats the id rule above: [hidden] only wins at equal specificity. */
      #algoBox[hidden] { display: none; }
      #params { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
        align-items: center; border-top: 1px solid #1e3a44; padding-top: 7px; }
      #params label { color: #b9cdd3; white-space: nowrap; }
      #params input[type="number"] { width: 8ch; }
      #params input, #params select { font: inherit; padding: 3px 6px;
        border-radius: 6px; border: 1px solid #2b4149; background: #0d1c22;
        color: #eaf6f3; }
      .phelp { grid-column: 2; color: #6f868e; margin: -2px 0 4px; }
      #replay select, #replay button { font: inherit; padding: 6px 10px;
        border-radius: 7px; border: 1px solid #2b4149; background: #12242b;
        color: #eaf6f3; max-width: 42ch; }
      #replayBtn { border-color: #1e7a5f; background: #0e3a2f; }
      #replayHint { color: #8aa0a8; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="status">connecting…</div>
    <a id="back" href="/">&larr; home</a>
    <div id="replay">
      <div class="row">
        <span id="replayHint">recorded runs:</span>
        <select id="logSelect"></select>
        <button id="replayBtn">Replay</button>
        <button id="stopBtn">Stop</button>
      </div>
      <div class="row">
        <button id="algoToggle" title="show method and parameters (A)">
          &#9656; algorithms
        </button>
        <span id="algoSummary"></span>
      </div>
      <div id="algoBox" hidden>
        <div class="row">
          <span>method:</span>
          <select id="methodSelect"></select>
          <button id="resetParams">defaults</button>
        </div>
        <div id="methodDesc"></div>
        <div id="params"></div>
      </div>
    </div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
