<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metroid Scan</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a; }
      #app { width: 100%; height: 100%; touch-action: none; }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
      }
      #reticule { width: 36px; height: 36px; border: 2px solid #7cf7c4; border-radius: 50%; opacity: 0.8; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud"><div id="reticule"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
