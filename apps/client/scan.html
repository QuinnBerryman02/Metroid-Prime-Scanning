<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metroid Scan</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #7cf7c4;
        --warm: #ffd54f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05080a;
        font: 14px/1.4 ui-monospace, Menlo, monospace;
        color: #d7e2e6;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        -webkit-user-drag: none;
        pointer-events: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #overlay.hidden {
        display: none;
      }
      #depthImg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: none;
        z-index: 5;
      }
      #depthImg.show {
        display: block;
      }

      /* --- reticle --- */
      #reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 2px solid rgba(124, 247, 196, 0.75);
        border-radius: 50%;
        pointer-events: none;
        z-index: 7;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #reticle::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--accent);
        transition: background 0.2s;
      }
      #reticle .ring {
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--warm);
        opacity: 0;
        transition: opacity 0.2s;
      }
      #reticle.scanning {
        border-color: var(--warm);
        box-shadow: 0 0 18px rgba(255, 213, 79, 0.45);
        animation: pulse 1.2s ease-in-out infinite;
      }
      #reticle.scanning::before {
        background: var(--warm);
      }
      #reticle.scanning .ring {
        opacity: 1;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      /* --- radial wheel --- */
      #wheel {
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        display: none;
      }
      #wheel.show {
        display: block;
        animation: fadein 0.12s ease-out;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
      }
      .wheel-opt {
        position: absolute;
        width: 74px;
        height: 74px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 2px solid #2b4149;
        background: rgba(10, 22, 28, 0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1.15;
        text-align: center;
        color: #cfe6e0;
        transition:
          border-color 0.1s,
          background 0.1s,
          transform 0.1s;
      }
      .wheel-opt .dev {
        font-size: 9px;
        opacity: 0.65;
        margin-top: 2px;
      }
      .wheel-opt.selected {
        border-color: var(--warm);
        background: rgba(58, 42, 10, 0.95);
        color: var(--warm);
        transform: translate(-50%, -50%) scale(1.18);
      }
      .wheel-opt.unavailable {
        opacity: 0.35;
      }
      .wheel-hub {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px dashed #34505c;
        background: rgba(10, 22, 28, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #8fb3ac;
      }

      /* --- chrome --- */
      #topbar {
        position: fixed;
        left: 8px;
        top: 8px;
        right: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }
      #status {
        padding: 7px 12px;
        border-radius: 8px;
        background: rgba(4, 12, 15, 0.78);
        border: 1px solid #1e3a44;
        max-width: 70vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status.busy {
        border-color: var(--warm);
        color: var(--warm);
      }
      #topbar a {
        color: var(--accent);
        text-decoration: none;
        padding: 7px 12px;
        border: 1px solid #1e3a44;
        border-radius: 8px;
        background: rgba(4, 12, 15, 0.78);
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 20px;
        background: rgba(4, 12, 15, 0.7);
        border: 1px solid #1e3a44;
        color: #9fc8bd;
        font-size: 12px;
        z-index: 10;
      }
      #hint.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <video
      id="video"
      playsinline
      muted
      autoplay
      disablepictureinpicture
      controlslist="nodownload noplaybackrate"
    ></video>
    <canvas id="overlay"></canvas>
    <img id="depthImg" alt="depth map" />
    <div id="reticle"><span class="ring"></span></div>
    <div id="wheel"></div>

    <div id="topbar">
      <span id="status">starting camera…</span>
      <a href="/">&larr; home</a>
    </div>
    <div id="hint">Hold to scan</div>

    <pre id="debug"></pre>
    <script type="module" src="/src/scan.ts"></script>
  </body>
</html>
